spring.application.name=financial_planner_api
# Disable serving static resources so the application behaves as an API-only backend
spring.web.resources.add-mappings=false

# Server configuration
server.port=8080

# Enable debug logging to see what's happening
logging.level.root=INFO
logging.level.com.not_found.financial_planner_api=DEBUG

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:walletwatch
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
